[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfp-date-extractor"
version = "0.1.0"
description = "Extract submission, notification and camera-ready dates from call-for-papers text."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
cfp-date-extractor = "cfp_date_extractor.cli:main"

[tool.setuptools]
packages = ["cfp_date_extractor"]
